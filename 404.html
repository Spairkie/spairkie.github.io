<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
/* set theme before first paint -- same key/logic as the main site, so a broken
   link doesn't dump someone in light mode into a jarring forced-dark 404 */
(function(){
  try{
    var saved = localStorage.getItem('hs_theme');
    var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    if(theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
  }catch(e){}
})();
</script>
<title>404 | Hans Sai</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e14;
    --accent:#5eead4;
    --accent-glow:rgba(94,234,212,0.16);
    --amber:#f0b429;
    --text:#e7ecf3;
    --text-dim:#8a97a8;
    --font-display:'Space Grotesk',system-ui,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,monospace;
  }
  :root[data-theme="light"]{
    --bg:#f4f1ea;
    --accent:#148c7c;
    --accent-glow:rgba(20,140,124,0.14);
    --amber:#b4780f;
    --text:#1c2129;
    --text-dim:#5d6672;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--text);
    font-family:var(--font-mono);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    transition:background 0.3s ease, color 0.3s ease;
  }

  canvas{ position:fixed; inset:0; z-index:-1; }

  .container{ text-align:center; padding:1.5rem; max-width:640px; box-sizing:border-box; }

  .error-code{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(4rem, 18vw, 11rem);
    line-height:1;
    margin:0 0 0.9rem;
    letter-spacing:-0.02em;
    color:var(--accent);
  }
  .digit{
    display:inline-block;
    opacity:0;
    animation:fadeIn 0.6s forwards ease-out;
    text-shadow:0 0 18px var(--accent-glow), 0 0 48px var(--accent-glow);
  }
  .digit.left  { transform:translateX(-40px); animation-delay:0.15s; }
  .digit.top   { transform:translateY(-40px); animation-delay:0.4s; }
  .digit.right { transform:translateX(40px);  animation-delay:0.65s; }
  @keyframes fadeIn{ to{ opacity:1; transform:translate(0,0); } }

  .error-code:hover{ animation:jitter 0.25s steps(2,end) 1; cursor:default; }
  @keyframes jitter{
    0%{ transform:translate(0,0); }
    25%{ transform:translate(-1px,1px); }
    50%{ transform:translate(1px,-1px); }
    75%{ transform:translate(-1px,-2px); }
    100%{ transform:translate(0,0); }
  }

  .terminal-message{
    font-size:clamp(0.85rem, 2.2vw, 1.02rem);
    line-height:1.85;
    color:var(--text-dim);
  }
  .terminal-message .prompt{ color:var(--amber); }
  .terminal-message .msg-line{ color:var(--text); }

  .redirect-note{ margin-top:1.4rem; font-size:0.88rem; opacity:0.75; }

  a{ color:var(--accent); text-decoration:underline; text-underline-offset:2px; }
  a:hover{ color:var(--text); }

  .home-link{
    display:inline-flex; align-items:center; gap:0.5em;
    margin-top:1.6rem; padding:0.6em 1.3em;
    border:1px solid var(--accent); border-radius:999px;
    color:var(--accent); text-decoration:none;
    font-family:var(--font-display); font-size:0.92rem; font-weight:500;
    transition:background 0.2s ease, color 0.2s ease;
  }
  .home-link:hover{ background:var(--accent); color:var(--bg); }
  .home-link:focus-visible, a:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  .cursor{ display:inline-block; width:1ch; animation:blink 1s step-end infinite; }
  @keyframes blink{ 0%,100%{opacity:0;} 50%{opacity:1;} }

  #countdown{ font-weight:600; color:var(--amber); display:inline-block; animation:pulse 1s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:0.65; transform:scale(1.15);} }

  #dots::after{
    content:''; display:inline-block; width:1.5ch; text-align:left;
    animation:loadingDots 1.5s steps(4,end) infinite;
  }
  @keyframes loadingDots{ 0%{content:'';} 25%{content:'.';} 50%{content:'..';} 75%{content:'...';} 100%{content:'';} }

  @media (prefers-reduced-motion: reduce){
    .digit{ animation:none; opacity:1; transform:none; }
    .error-code:hover{ animation:none; }
    .cursor, #countdown, #dots::after{ animation:none; }
    #dots::after{ content:'...'; }
  }
</style>
</head>
<body>

  <canvas id="binaryCanvas" aria-hidden="true"></canvas>

  <div class="container">
    <div class="error-code" aria-label="404">
      <span class="digit left">4</span>
      <span class="digit top">0</span>
      <span class="digit right">4</span>
    </div>

    <div class="terminal-message">
      <div><span class="prompt">&gt;</span> SYSTEM MESSAGE:</div>
      <div class="msg-line"><span id="scrambleText">n3d#f!e_u</span><span class="cursor">_</span></div>
      <div><span class="prompt">&gt;</span> Attempting reconnection in <span id="countdown">15</span> seconds<span id="dots"></span></div>
      <div><span class="prompt">&gt;</span> Press [Esc] to return immediately.</div>
    </div>

    <a class="home-link" href="/">&larr; Return home</a>
    <div class="redirect-note">Looking for a specific project? <a href="/#projects">Jump to projects</a></div>
  </div>

  <script>
    // === Background canvas: sparse binary rain, matches the theme's accent color ===
    var canvas = document.getElementById('binaryCanvas');
    var ctx = canvas.getContext('2d');
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function accentColor(){
      return getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#5eead4';
    }
    function hexToRgb(hex){
      hex = hex.replace('#','');
      if(hex.length === 3) hex = hex.split('').map(function(c){ return c+c; }).join('');
      var num = parseInt(hex, 16);
      return [(num>>16)&255, (num>>8)&255, num&255];
    }

    function resizeCanvas(){
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    var rgb = hexToRgb(accentColor());

    function Particle(){ this.reset(); }
    Particle.prototype.reset = function(){
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.speed = 0.4 + Math.random() * 1.1;
      this.size = 14 + Math.random() * 9;
      this.char = Math.random() > 0.5 ? '0' : '1';
      this.opacity = 0.04 + Math.random() * 0.18;
      this.rotation = Math.random() * Math.PI * 2;
    };
    Particle.prototype.update = function(){
      this.y -= this.speed;
      if(this.y < -this.size){ this.reset(); this.y = canvas.height + this.size; }
    };
    Particle.prototype.draw = function(){
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rotation);
      ctx.font = this.size + 'px "JetBrains Mono", monospace';
      ctx.fillStyle = 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + this.opacity + ')';
      ctx.fillText(this.char, 0, 0);
      ctx.restore();
    };

    var particles = [];
    for(var i = 0; i < 70; i++) particles.push(new Particle());

    function drawStatic(){
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(function(p){ p.draw(); });
    }

    var raf = null;
    function animate(){
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(function(p){ p.update(); p.draw(); });
      raf = requestAnimationFrame(animate);
    }
    if(reduceMotion){ drawStatic(); }
    else{ animate(); }

    // === Scramble typing animation ===
    var scrambleEl = document.getElementById('scrambleText');
    var targetText = "You've reached an undefined node in the matrix.";
    var scrambleChars = '01<>/#$%&*ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    var frame = 0;
    var delay = 40;
    var scrambleSpeed = 2;
    var output = new Array(targetText.length).fill('');

    function updateScramble(){
      var mid = Math.floor(targetText.length / 2);
      var radius = Math.floor(frame / scrambleSpeed);
      for(var i = 0; i < targetText.length; i++){
        var dist = Math.abs(i - mid);
        output[i] = dist <= radius ? targetText[i] : scrambleChars[Math.floor(Math.random() * scrambleChars.length)];
      }
      scrambleEl.textContent = output.join('');
      if(output.join('') !== targetText){
        frame++;
        setTimeout(updateScramble, delay);
      }
    }
    if(reduceMotion){ scrambleEl.textContent = targetText; }
    else{ setTimeout(updateScramble, 400); }

    // === Countdown + redirect ===
    var seconds = 15;
    var countdownEl = document.getElementById('countdown');
    var timer = setInterval(function(){
      seconds--;
      countdownEl.textContent = seconds;
      if(seconds <= 0){
        clearInterval(timer);
        window.location.href = '/';
      }
    }, 1000);

    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape') window.location.href = '/';
    });
  </script>

</body>
</html>
