name: Fix Projects scroll engine v2
on:
  push:
    branches: [fix/projects-scroll-engine-v2]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply interaction fix
        run: python3 scripts/fix_projects_scroll_v2.py
      - name: Validate source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          assert 'smoothWheel: false' in text
          assert 'virtualScroll:' not in text
          assert 'height:430vh' in text
          assert 'data-lenis-prevent tabindex="-1"' in text
          assert 'Scroll · ← → select · ↓ open' in text
          assert 'aria-keyshortcuts="ArrowLeft ArrowRight ArrowDown Enter"' in text
          assert "window.addEventListener('scroll',scheduleFromScroll,{passive:true})" in text
          project_start=text.index("var root = document.querySelector('.folio-section')")
          project_end=text.index("var canvas = document.getElementById('aboutCanvas')", project_start)
          projects=text[project_start:project_end]
          assert "window.hsLenis.on('scroll'" not in projects
          assert 'if(index === activeIndex) return;' in projects
          assert "e.key==='ArrowRight'" in projects and "e.key==='ArrowLeft'" in projects
          assert "e.key==='ArrowDown' || e.key==='Enter'" in projects
          assert 'scrollDetail(1)' in projects
          assert "detailScroll.scrollTop<=8" in projects
          assert "hs:folio-active" in text
          class IDs(HTMLParser):
            def __init__(self): super().__init__(); self.ids=[]
            def handle_starttag(self, tag, attrs):
              for k,v in attrs:
                if k=='id' and v: self.ids.append(v)
          p=IDs(); p.feed(text)
          dup=sorted({x for x in p.ids if p.ids.count(x)>1})
          assert not dup, 'duplicate ids: '+', '.join(dup)
          blocks=[]
          for m in re.finditer(r'<script([^>]*)>(.*?)</script>',text,re.S|re.I):
            attrs=m.group(1)
            if re.search(r'\bsrc\s*=',attrs,re.I): continue
            tm=re.search(r'\btype\s*=\s*["\']([^"\']+)',attrs,re.I)
            if tm and tm.group(1).lower() not in ('text/javascript','application/javascript','module'): continue
            blocks.append(m.group(2))
          out=Path('/tmp/js-check'); out.mkdir(exist_ok=True)
          for i,b in enumerate(blocks): (out/f'{i}.js').write_text(b,encoding='utf-8')
          PY
          for f in /tmp/js-check/*.js; do node --check "$f"; done
          git diff --check
      - name: Browser interaction QA
        run: |
          mkdir -p /tmp/projects-qa
          npm install --prefix /tmp/projects-qa puppeteer-core@24 >/dev/null 2>&1
          python3 -m http.server 8000 >/tmp/projects-http.log 2>&1 &
          SERVER_PID=$!
          export NODE_PATH=/tmp/projects-qa/node_modules
          cat >/tmp/projects-qa.js <<'JS'
          const puppeteer = require('puppeteer-core');
          const fs = require('fs');
          const cp = require('child_process');
          function chromePath(){
            for(const c of ['google-chrome','google-chrome-stable','chromium','chromium-browser']){
              try{return cp.execFileSync('which',[c],{encoding:'utf8'}).trim();}catch(e){}
            }
            throw new Error('Chrome not found');
          }
          function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:chromePath(),args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:1440,height:900,deviceScaleFactor:1});
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:30000});
            await page.evaluate(()=>{try{sessionStorage.setItem('hs_booted','1')}catch(e){}});
            await page.reload({waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>window.hsProjects && document.getElementById('projects'),{timeout:10000});
            await page.evaluate(()=>{
              const r=document.getElementById('projects');
              window.scrollTo(0,r.offsetTop+90);
            });
            await sleep(120);
            const mode=await page.evaluate(()=>window.hsLenis ? window.hsLenis.options.smoothWheel : false);
            if(mode!==false) throw new Error('smoothWheel is not disabled');
            await page.mouse.move(720,450);
            let previous=await page.evaluate(()=>window.scrollY);
            for(let i=0;i<5;i++){
              await page.mouse.wheel({deltaY:120});
              await sleep(70);
              const y=await page.evaluate(()=>window.scrollY);
              if(y<=previous) throw new Error('wheel input did not advance promptly at sample '+i+' ('+previous+' -> '+y+')');
              previous=y;
            }
            await page.evaluate(()=>{
              const r=document.getElementById('projects');
              window.scrollTo(0,r.offsetTop+80);
            });
            await sleep(100);
            const before=await page.evaluate(()=>document.querySelector('.folio-project[aria-current="true"]')?.id||'');
            await page.keyboard.press('ArrowRight');
            await sleep(450);
            const after=await page.evaluate(()=>document.querySelector('.folio-project[aria-current="true"]')?.id||'');
            if(!before || !after || before===after) throw new Error('ArrowRight did not change project: '+before+' -> '+after);
            await page.keyboard.press('ArrowDown');
            await sleep(120);
            const opened=await page.evaluate(()=>!document.getElementById('folioDetail').hidden && document.getElementById('folioDetail').classList.contains('is-open'));
            if(!opened) throw new Error('ArrowDown did not open selected project');
            await page.keyboard.press('ArrowDown');
            await sleep(520);
            let detailY=await page.evaluate(()=>document.getElementById('folioDetailScroll').scrollTop);
            if(detailY<=0) throw new Error('ArrowDown did not scroll inside project detail');
            await page.evaluate(()=>document.getElementById('folioDetailScroll').scrollTo(0,0));
            await sleep(50);
            await page.mouse.move(720,600);
            await page.mouse.wheel({deltaY:500});
            await sleep(120);
            detailY=await page.evaluate(()=>document.getElementById('folioDetailScroll').scrollTop);
            if(detailY<=0) throw new Error('Wheel did not scroll nested project detail while Lenis is stopped');
            const title1=await page.evaluate(()=>document.getElementById('folioDetailTitle').textContent);
            await page.keyboard.press('ArrowRight');
            await sleep(100);
            const title2=await page.evaluate(()=>document.getElementById('folioDetailTitle').textContent);
            if(title1===title2) throw new Error('ArrowRight did not switch project in detail');
            await page.keyboard.press('Escape');
            await sleep(900);
            const closed=await page.evaluate(()=>document.getElementById('folioDetail').hidden);
            if(!closed) throw new Error('Escape did not close project detail');
            console.log(JSON.stringify({wheelSamples:5,keyboardProject:[before,after],detailWheelScroll:detailY,detailSwitch:[title1,title2]},null,2));
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          JS
          node /tmp/projects-qa.js
          kill $SERVER_PID || true
      - name: Remove temporary files
        run: rm -f scripts/fix_projects_scroll_v2.py .github/workflows/fix-projects-scroll-v2.yml
      - name: Commit fix
        run: |
          git config user.name "Hans Sai"
          git config user.email "37721651+Spairkie@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize Projects scrolling and keyboard navigation"
          git push
