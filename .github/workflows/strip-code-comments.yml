name: Strip code comments

on:
  push:
    branches:
      - cleanup/remove-code-comments
    paths:
      - .github/workflows/strip-code-comments.yml

permissions:
  contents: write

jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove comments safely
        shell: python
        run: |
          import pathlib
          import re

          root = pathlib.Path('.')

          def blank_comment(text):
              return ''.join('\n' if ch == '\n' else '' for ch in text)

          def strip_css(text):
              out = []
              i = 0
              n = len(text)
              quote = None
              while i < n:
                  ch = text[i]
                  if quote is not None:
                      out.append(ch)
                      if ch == '\\' and i + 1 < n:
                          i += 1
                          out.append(text[i])
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue
                  if ch in ('\"', "'"):
                      quote = ch
                      out.append(ch)
                      i += 1
                      continue
                  if ch == '/' and i + 1 < n and text[i + 1] == '*':
                      j = text.find('*/', i + 2)
                      if j == -1:
                          j = n - 2
                      removed = text[i:j + 2]
                      out.append('\n' * removed.count('\n'))
                      if '\n' not in removed:
                          out.append(' ')
                      i = j + 2
                      continue
                  out.append(ch)
                  i += 1
              return ''.join(out)

          def strip_js(text):
              n = len(text)

              def previous_word(pos):
                  j = pos - 1
                  while j >= 0 and text[j].isspace():
                      j -= 1
                  end = j + 1
                  while j >= 0 and (text[j].isalnum() or text[j] in '_$'):
                      j -= 1
                  return text[j + 1:end]

              def regex_can_start(pos):
                  j = pos - 1
                  while j >= 0 and text[j].isspace():
                      j -= 1
                  if j < 0:
                      return True
                  if text[j] in '([{=,:;!&|?+-*%^~<>':
                      return True
                  return previous_word(pos) in {
                      'return', 'throw', 'case', 'delete', 'void', 'typeof',
                      'instanceof', 'in', 'of', 'yield', 'await', 'else', 'do'
                  }

              def copy_string(i, quote):
                  buf = [text[i]]
                  i += 1
                  while i < n:
                      ch = text[i]
                      buf.append(ch)
                      if ch == '\\' and i + 1 < n:
                          i += 1
                          buf.append(text[i])
                      elif ch == quote:
                          i += 1
                          break
                      i += 1
                  return ''.join(buf), i

              def copy_regex(i):
                  buf = ['/']
                  i += 1
                  in_class = False
                  while i < n:
                      ch = text[i]
                      buf.append(ch)
                      if ch == '\\' and i + 1 < n:
                          i += 1
                          buf.append(text[i])
                      elif ch == '[':
                          in_class = True
                      elif ch == ']' and in_class:
                          in_class = False
                      elif ch == '/' and not in_class:
                          i += 1
                          while i < n and (text[i].isalpha() or text[i].isdigit()):
                              buf.append(text[i])
                              i += 1
                          break
                      elif ch == '\n':
                          break
                      i += 1
                  return ''.join(buf), i

              def parse_template(i):
                  buf = ['`']
                  i += 1
                  while i < n:
                      ch = text[i]
                      if ch == '\\' and i + 1 < n:
                          buf.append(ch)
                          i += 1
                          buf.append(text[i])
                          i += 1
                          continue
                      if ch == '`':
                          buf.append(ch)
                          return ''.join(buf), i + 1
                      if ch == '$' and i + 1 < n and text[i + 1] == '{':
                          buf.append('${')
                          inner, i = parse_code(i + 2, True)
                          buf.append(inner)
                          if i < n and text[i] == '}':
                              buf.append('}')
                              i += 1
                          continue
                      buf.append(ch)
                      i += 1
                  return ''.join(buf), i

              def parse_code(i, stop_at_brace=False):
                  buf = []
                  brace_depth = 0
                  while i < n:
                      ch = text[i]
                      if stop_at_brace and ch == '}' and brace_depth == 0:
                          return ''.join(buf), i
                      if ch in ('\"', "'"):
                          token, i = copy_string(i, ch)
                          buf.append(token)
                          continue
                      if ch == '`':
                          token, i = parse_template(i)
                          buf.append(token)
                          continue
                      if ch == '/' and i + 1 < n and text[i + 1] == '/':
                          j = text.find('\n', i + 2)
                          if j == -1:
                              return ''.join(buf), n
                          buf.append('\n')
                          i = j + 1
                          continue
                      if ch == '/' and i + 1 < n and text[i + 1] == '*':
                          j = text.find('*/', i + 2)
                          if j == -1:
                              j = n - 2
                          removed = text[i:j + 2]
                          buf.append('\n' * removed.count('\n'))
                          if '\n' not in removed:
                              buf.append(' ')
                          i = j + 2
                          continue
                      if ch == '/' and regex_can_start(i):
                          token, i = copy_regex(i)
                          buf.append(token)
                          continue
                      if stop_at_brace:
                          if ch == '{':
                              brace_depth += 1
                          elif ch == '}' and brace_depth > 0:
                              brace_depth -= 1
                      buf.append(ch)
                      i += 1
                  return ''.join(buf), i

              return parse_code(0)[0]

          block_re = re.compile(r'(?is)<(?:script|style)\b[^>]*>.*?</(?:script|style)\s*>')
          html_comment_re = re.compile(r'(?s)<!--.*?-->')

          def strip_html(text):
              out = []
              last = 0
              for match in block_re.finditer(text):
                  outside = text[last:match.start()]
                  outside = html_comment_re.sub(lambda m: '\n' * m.group(0).count('\n'), outside)
                  out.append(outside)
                  block = match.group(0)
                  open_end = block.find('>') + 1
                  close_start = block.lower().rfind('</')
                  opener = block[:open_end]
                  body = block[open_end:close_start]
                  closer = block[close_start:]
                  if opener.lower().startswith('<style'):
                      body = strip_css(body)
                  else:
                      body = strip_js(body)
                  out.extend((opener, body, closer))
                  last = match.end()
              outside = text[last:]
              outside = html_comment_re.sub(lambda m: '\n' * m.group(0).count('\n'), outside)
              out.append(outside)
              return ''.join(out)

          changed = []
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              suffix = path.suffix.lower()
              if suffix not in {'.html', '.htm', '.css', '.js', '.mjs', '.cjs'}:
                  continue
              original = path.read_text(encoding='utf-8')
              if suffix in {'.html', '.htm'}:
                  cleaned = strip_html(original)
              elif suffix == '.css':
                  cleaned = strip_css(original)
              else:
                  cleaned = strip_js(original)
              if cleaned != original:
                  path.write_text(cleaned, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          for path in changed:
              print(path)
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' '*.htm' '*.css' '*.js' '*.mjs' '*.cjs'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove code comments"
          git push
