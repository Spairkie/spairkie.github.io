name: Projects computed layout QA

on:
  push:
    branches:
      - redesign/projects-aristide-inspired
    paths:
      - .github/workflows/projects-layout-debug.yml

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build layout QA page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          css='<style>#boot-screen,#matrixFX{display:none!important}html{scroll-behavior:auto!important}</style>'
          script='''<script>(function(){document.documentElement.setAttribute("data-theme","dark");function go(){var p=document.getElementById("projects");if(!p)return setTimeout(go,80);var y=p.getBoundingClientRect().top+scrollY;try{if(window.hsLenis)window.hsLenis.scrollTo(y,{immediate:true})}catch(e){}scrollTo(0,y);setTimeout(function(){var lines=[];function info(label,e){if(!e){lines.push(label+":MISSING");return}var r=e.getBoundingClientRect(),c=getComputedStyle(e);lines.push(label+"|rect="+[r.left,r.top,r.width,r.height].map(function(v){return Math.round(v)}).join(",")+"|display="+c.display+"|vis="+c.visibility+"|opacity="+c.opacity+"|transform="+c.transform)}info("projects",p);info("sticky",document.querySelector(".folio-sticky"));info("top",document.querySelector(".folio-topline"));info("ribbon",document.querySelector(".folio-ribbon"));info("caption",document.querySelector(".folio-caption"));document.querySelectorAll(".folio-project").forEach(function(e,i){info("card"+(i+1),e)});var pre=document.createElement("pre");pre.id="layoutQA";pre.textContent="viewport="+innerWidth+"x"+innerHeight+"|scrollY="+Math.round(scrollY)+"\\n"+lines.join("\\n");document.body.appendChild(pre)},900)}setTimeout(go,250)})();</script>'''
          text=text.replace('</head>',css+'</head>',1).replace('</body>',script+'</body>',1)
          Path('layout-qa.html').write_text(text,encoding='utf-8')
          PY
      - name: Dump computed layouts
        run: |
          python3 -m http.server 4173 >/tmp/server.log 2>&1 & SERVER_PID=$!; sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          COMMON="--headless=new --no-sandbox --disable-dev-shm-usage --virtual-time-budget=3000"
          "$CHROME" $COMMON --window-size=1440,900 --dump-dom 'http://127.0.0.1:4173/layout-qa.html' > desktop-layout.html
          "$CHROME" $COMMON --window-size=390,844 --dump-dom 'http://127.0.0.1:4173/layout-qa.html' > mobile-layout.html
          kill "$SERVER_PID"
      - uses: actions/upload-artifact@v4
        with:
          name: projects-layout-qa
          path: |
            desktop-layout.html
            mobile-layout.html
      - name: Remove layout QA workflow
        run: rm -f layout-qa.html desktop-layout.html mobile-layout.html .github/workflows/projects-layout-debug.yml
      - name: Commit cleanup
        run: |
          git config user.name "Hans Sai"
          git config user.email "37721651+Spairkie@users.noreply.github.com"
          git add -A
          git commit -m "Remove Projects layout QA workflow"
          git push
