name: Projects render debug

on:
  push:
    branches:
      - redesign/projects-aristide-inspired
    paths:
      - .github/workflows/projects-render-debug.yml

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build debug page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          css='<style>#boot-screen,#matrixFX{display:none!important}html{scroll-behavior:auto!important}#qaDebug{position:fixed;left:8px;top:8px;z-index:999999;background:#fff;color:#000;padding:10px;font:11px monospace;white-space:pre;max-width:95vw;max-height:90vh;overflow:auto}</style>'
          script='''<script>(function(){document.documentElement.setAttribute("data-theme","dark");function go(){var p=document.getElementById("projects");if(!p)return setTimeout(go,100);var y=p.getBoundingClientRect().top+scrollY;try{if(window.hsLenis)window.hsLenis.scrollTo(y,{immediate:true})}catch(e){}scrollTo(0,y);setTimeout(function(){var sels=["#projects",".folio-sticky",".folio-shell",".folio-topline",".folio-stage",".folio-ribbon",".folio-project",".folio-caption"];var rows=sels.map(function(s){var e=document.querySelector(s);if(!e)return s+": MISSING";var r=e.getBoundingClientRect(),c=getComputedStyle(e);return s+" rect="+[r.left,r.top,r.width,r.height].map(function(v){return Math.round(v)}).join(",")+" display="+c.display+" vis="+c.visibility+" opacity="+c.opacity+" z="+c.zIndex+" color="+c.color+" transform="+c.transform});var d=document.createElement("pre");d.id="qaDebug";d.textContent="scrollY="+Math.round(scrollY)+" bodyH="+document.body.scrollHeight+" viewport="+innerWidth+"x"+innerHeight+"\\n"+rows.join("\\n");document.body.appendChild(d)},700)}setTimeout(go,400)})();</script>'''
          text=text.replace('</head>',css+'</head>',1).replace('</body>',script+'</body>',1)
          Path('debug.html').write_text(text,encoding='utf-8')
          PY
      - name: Render debug
        run: |
          python3 -m http.server 4173 >/tmp/server.log 2>&1 & SERVER_PID=$!; sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=3500 --window-size=1440,900 --screenshot=render-debug.png 'http://127.0.0.1:4173/debug.html'
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --virtual-time-budget=3500 --dump-dom 'http://127.0.0.1:4173/debug.html' > render-debug.html
          kill "$SERVER_PID"
      - uses: actions/upload-artifact@v4
        with:
          name: projects-render-debug
          path: |
            render-debug.png
            render-debug.html
      - name: Remove debug workflow
        run: rm -f debug.html render-debug.png render-debug.html .github/workflows/projects-render-debug.yml
      - name: Commit cleanup
        run: |
          git config user.name "Hans Sai"
          git config user.email "37721651+Spairkie@users.noreply.github.com"
          git add -A
          git commit -m "Remove Projects render debug workflow"
          git push
