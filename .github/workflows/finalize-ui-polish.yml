name: Finalize UI polish

on:
  push:
    branches:
      - polish/preloader-marquee
    paths:
      - .github/workflows/finalize-ui-polish.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize copy and hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('class="boot-skip" id="bootSkip"', 'class="boot-skip"')
          s = s.replace("'finalizing', 'checking runtime'", "'finalizing', 'finalizing launch'")
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
      - name: Remove temporary workflow
        run: rm -f .github/workflows/finalize-ui-polish.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize preloader polish"
          git push
