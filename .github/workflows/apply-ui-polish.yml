name: Apply UI polish

on:
  push:
    branches:
      - polish/preloader-marquee
    paths:
      - .github/workflows/apply-ui-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI polish
        run: python3 .github/ui_polish.py
      - name: Validate diff
        run: git diff --check
      - name: Remove temporary files
        run: rm -f .github/workflows/apply-ui-polish.yml .github/ui_polish.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish preloader and marquee behavior"
          git push
