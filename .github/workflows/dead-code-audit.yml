name: Dead code audit

on:
  push:
    branches:
      - cleanup/dead-code-audit
    paths:
      - .github/workflows/dead-code-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit static references
        shell: python
        run: |
          from pathlib import Path
          import re
          from urllib.parse import unquote

          root = Path('.')
          targets = [Path('index.html'), Path('404.html')]
          report = []

          def strip_styles(text):
              return re.sub(r'(?is)<style\b[^>]*>.*?</style\s*>', '', text)

          def style_bodies(text):
              return re.findall(r'(?is)<style\b[^>]*>(.*?)</style\s*>', text)

          def script_bodies(text):
              return re.findall(r'(?is)<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script\s*>', text)

          def static_classes(text):
              vals = []
              for m in re.finditer(r'\bclass\s*=\s*(["\'])(.*?)\1', text, re.I | re.S):
                  vals.extend(m.group(2).split())
              return set(vals)

          def static_ids(text):
              return set(m.group(2) for m in re.finditer(r'\bid\s*=\s*(["\'])(.*?)\1', text, re.I | re.S))

          def css_tokens(text):
              classes, ids = set(), set()
              for css in style_bodies(text):
                  css = re.sub(r'/\*.*?\*/', '', css, flags=re.S)
                  for block in re.finditer(r'([^{}]+)\{', css):
                      selector = block.group(1).strip()
                      if selector.startswith('@'):
                          continue
                      classes.update(re.findall(r'\.([A-Za-z_][\w-]*)', selector))
                      ids.update(re.findall(r'#([A-Za-z_][\w-]*)', selector))
              return classes, ids

          def word_count(text, token):
              return len(re.findall(r'(?<![\w$])' + re.escape(token) + r'(?![\w$])', text))

          for path in targets:
              text = path.read_text(encoding='utf-8')
              non_style = strip_styles(text)
              classes = static_classes(non_style)
              ids = static_ids(non_style)
              css_classes, css_ids = css_tokens(text)
              scripts = '\n'.join(script_bodies(text))

              report.append(f'## {path}')
              report.append('')
              report.append('### CSS class selectors with no reference outside <style>')
              dead_classes = []
              for c in sorted(css_classes):
                  if not re.search(r'(?<![\w-])' + re.escape(c) + r'(?![\w-])', non_style):
                      dead_classes.append(c)
              report.extend(f'- .{c}' for c in dead_classes)
              if not dead_classes:
                  report.append('- none')
              report.append('')

              report.append('### CSS id selectors with no reference outside <style>')
              dead_css_ids = []
              for i in sorted(css_ids):
                  if not re.search(r'(?<![\w-])' + re.escape(i) + r'(?![\w-])', non_style):
                      dead_css_ids.append(i)
              report.extend(f'- #{i}' for i in dead_css_ids)
              if not dead_css_ids:
                  report.append('- none')
              report.append('')

              report.append('### Static IDs that occur only in their declaration')
              unused_ids = []
              for i in sorted(ids):
                  if len(re.findall(re.escape(i), non_style)) == 1:
                      unused_ids.append(i)
              report.extend(f'- #{i}' for i in unused_ids)
              if not unused_ids:
                  report.append('- none')
              report.append('')

              report.append('### Named JS functions with one token occurrence')
              funcs = sorted(set(re.findall(r'\bfunction\s+([A-Za-z_$][\w$]*)\s*\(', scripts)))
              one_use_funcs = [f for f in funcs if word_count(scripts, f) == 1]
              report.extend(f'- {f}()' for f in one_use_funcs)
              if not one_use_funcs:
                  report.append('- none')
              report.append('')

              report.append('### var/let/const names with one token occurrence')
              decls = sorted(set(re.findall(r'\b(?:var|let|const)\s+([A-Za-z_$][\w$]*)\b', scripts)))
              one_use_vars = [v for v in decls if word_count(scripts, v) == 1]
              report.extend(f'- {v}' for v in one_use_vars)
              if not one_use_vars:
                  report.append('- none')
              report.append('')

          all_text = ''
          for path in [Path('index.html'), Path('404.html'), Path('manifest.json'), Path('README.md')]:
              if path.exists():
                  all_text += '\n' + unquote(path.read_text(encoding='utf-8', errors='ignore'))

          report.append('## Repository files with no textual reference from live entrypoints/docs')
          report.append('')
          special = {'index.html', '404.html', 'README.md', 'manifest.json'}
          candidates = []
          for p in sorted(root.rglob('*')):
              if not p.is_file() or '.git' in p.parts or '.github' in p.parts:
                  continue
              rel = p.as_posix()
              if rel in special:
                  continue
              if rel.startswith('archive/'):
                  candidates.append((rel, 'archive snapshot'))
                  continue
              if rel not in all_text and p.name not in all_text:
                  candidates.append((rel, 'no reference found'))
          report.extend(f'- {rel} — {why}' for rel, why in candidates)
          if not candidates:
              report.append('- none')
          report.append('')
          report.append('Note: this is a conservative candidate report. Dynamic selectors and public/deep-link APIs must be manually verified before deletion.')

          Path('audit-report.md').write_text('\n'.join(report) + '\n', encoding='utf-8')
      - name: Commit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-report.md
          git commit -m "Add dead-code audit report"
          git push
