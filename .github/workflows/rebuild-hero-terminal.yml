name: Rebuild hero terminal console
on:
  push:
    branches: [redesign/hero-terminal-console]
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply terminal redesign
        run: python3 scripts/rebuild_hero_terminal.py
      - name: Validate source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          required=[
            'id="heroTerminal"',
            'id="termInput"',
            'id="termCopy"',
            'terminal-quickbar',
            'terminal-snapshot',
            'window.hsTerminal=',
            "case 'history'",
            "e.key==='Tab'",
            "e.key==='ArrowUp'",
            "Ctrl+L clear",
            'grid-template-columns:minmax(0,1fr) minmax(420px,500px)'
          ]
          for token in required: assert token in text, f'missing {token}'
          forbidden=['whoami.sh','term-input-row','var lines = [\n    {p:true, t:"whoami"}']
          for token in forbidden: assert token not in text, f'legacy terminal token remains: {token}'
          class IDs(HTMLParser):
            def __init__(self): super().__init__(); self.ids=[]
            def handle_starttag(self,tag,attrs):
              for k,v in attrs:
                if k=='id' and v:self.ids.append(v)
          p=IDs();p.feed(text)
          dup=sorted({x for x in p.ids if p.ids.count(x)>1})
          assert not dup, 'duplicate ids: '+', '.join(dup)
          blocks=[]
          for m in re.finditer(r'<script([^>]*)>(.*?)</script>',text,re.S|re.I):
            attrs=m.group(1)
            if re.search(r'\bsrc\s*=',attrs,re.I): continue
            tm=re.search(r'\btype\s*=\s*["\']([^"\']+)',attrs,re.I)
            if tm and tm.group(1).lower() not in ('text/javascript','application/javascript','module'): continue
            blocks.append(m.group(2))
          out=Path('/tmp/js-check');out.mkdir(exist_ok=True)
          for i,b in enumerate(blocks):(out/f'{i}.js').write_text(b,encoding='utf-8')
          PY
          for f in /tmp/js-check/*.js; do node --check "$f"; done
          git diff --check
      - name: Browser terminal QA
        run: |
          mkdir -p /tmp/terminal-qa
          npm install --prefix /tmp/terminal-qa puppeteer-core@24 >/dev/null 2>&1
          python3 -m http.server 8000 >/tmp/terminal-http.log 2>&1 &
          SERVER_PID=$!
          export NODE_PATH=/tmp/terminal-qa/node_modules
          cat >/tmp/terminal-qa.js <<'JS'
          const puppeteer=require('puppeteer-core');
          const cp=require('child_process');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          function chromePath(){for(const c of ['google-chrome','google-chrome-stable','chromium','chromium-browser']){try{return cp.execFileSync('which',[c],{encoding:'utf8'}).trim()}catch(e){}}throw new Error('Chrome not found')}
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:chromePath(),args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:1440,height:1000});
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:30000});
            await page.evaluate(()=>sessionStorage.setItem('hs_booted','1'));
            await page.reload({waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>window.hsTerminal&&document.getElementById('heroTerminal'));
            await sleep(650);
            const desktop=await page.evaluate(()=>{
              const t=document.getElementById('heroTerminal'),r=t.getBoundingClientRect(),log=document.getElementById('termBody');
              return {w:r.width,h:r.height,quicks:t.querySelectorAll('[data-term-command]').length,facts:t.querySelectorAll('.terminal-fact').length,live:log.getAttribute('aria-live'),overflow:document.documentElement.scrollWidth-window.innerWidth};
            });
            if(desktop.w<420||desktop.h<400)throw new Error('terminal desktop layout too small '+JSON.stringify(desktop));
            if(desktop.quicks!==5||desktop.facts!==3||desktop.live!=='polite'||desktop.overflow>1)throw new Error('terminal desktop structure issue '+JSON.stringify(desktop));
            const input='#termInput';
            await page.click(input);
            await page.type(input,'help');await page.keyboard.press('Enter');await sleep(80);
            let text=await page.$eval('#termBody',el=>el.innerText);
            if(!text.includes('NAVIGATION')||!text.includes('Tab autocomplete'))throw new Error('help command output missing');
            await page.type(input,'pwd');await page.keyboard.press('Enter');
            await page.type(input,'whoami');await page.keyboard.press('Enter');
            await page.keyboard.press('ArrowUp');
            let value=await page.$eval(input,el=>el.value);if(value!=='whoami')throw new Error('history up expected whoami, got '+value);
            await page.keyboard.press('ArrowUp');value=await page.$eval(input,el=>el.value);if(value!=='pwd')throw new Error('history second up expected pwd, got '+value);
            await page.keyboard.press('ArrowDown');value=await page.$eval(input,el=>el.value);if(value!=='whoami')throw new Error('history down expected whoami, got '+value);
            await page.$eval(input,el=>el.value='proj');await page.click(input);await page.keyboard.press('Tab');
            value=await page.$eval(input,el=>el.value);if(value!=='projects')throw new Error('tab completion expected projects, got '+value);
            await page.$eval(input,el=>el.value='');
            await page.keyboard.down('Control');await page.keyboard.press('KeyL').catch(()=>{});await page.keyboard.up('Control');
            await page.evaluate(()=>{const e=new KeyboardEvent('keydown',{key:'l',ctrlKey:true,bubbles:true});document.getElementById('termInput').dispatchEvent(e)});
            await sleep(50);
            if((await page.$eval('#termBody',el=>el.children.length))!==0)throw new Error('Ctrl+L did not clear terminal');
            await page.click('[data-term-command="help"]');await sleep(50);
            if(!(await page.$eval('#termBody',el=>el.innerText)).includes('NAVIGATION'))throw new Error('quick command did not execute');
            await page.setViewport({width:390,height:844});await page.reload({waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>window.hsTerminal&&document.getElementById('heroTerminal'));await sleep(120);
            const mobile=await page.evaluate(()=>{const r=document.getElementById('heroTerminal').getBoundingClientRect();return {left:r.left,right:r.right,w:r.width,viewport:innerWidth,doc:document.documentElement.scrollWidth,input:!!document.getElementById('termInput'),quick:document.querySelectorAll('.term-quick').length};});
            if(!mobile.input||mobile.quick!==5||mobile.left<0||mobile.right>mobile.viewport+1||mobile.doc>mobile.viewport+1)throw new Error('mobile overflow/structure issue '+JSON.stringify(mobile));
            console.log(JSON.stringify({desktop,mobile,history:'ok',tab:'ok',quick:'ok'},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/terminal-qa.js
          kill $SERVER_PID || true
      - name: Remove temporary files
        run: rm -f scripts/rebuild_hero_terminal.py .github/workflows/rebuild-hero-terminal.yml
      - name: Commit redesign
        run: |
          git config user.name "Hans Sai"
          git config user.email "37721651+Spairkie@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild hero terminal as interactive ops console"
          git push
