name: Apply dead-code cleanup

on:
  push:
    branches:
      - cleanup/dead-code-audit
    paths:
      - .github/workflows/apply-dead-code-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove verified dead code and files
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          replacements = [
              (
                  ".terminal-cursor{display:inline-block;width:7px;height:14px;background:var(--accent);vertical-align:middle;animation:blink 1s step-end infinite;margin-left:2px;}\n@keyframes blink{50%{opacity:0;}}\n",
                  ""
              ),
              (
                  ".sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}\n\n",
                  ""
              ),
              (
                  ".pw-view-close-group{display:flex;align-items:center;gap:12px;font-family:var(--font-mono);font-size:11.5px;}\n.pw-view-pos{opacity:0.55;}\n",
                  ""
              ),
              (
                  ".edu-item{margin-bottom:18px;}\n.edu-item h4{font-family:var(--font-display);font-size:15.5px;margin:0 0 4px;font-weight:600;}\n.edu-item .meta{font-size:13px;color:var(--text-dimmer);}\n",
                  ""
              ),
              (
                  "el.querySelectorAll('.terminal-line, .terminal-cursor')",
                  "el.querySelectorAll('.terminal-line')"
              ),
              (' class="timeline timeline-compact"', ' class="timeline"'),
              ('<span class="cert-name">', '<span>'),
              ('<a class="link-primary" ', '<a '),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f'Expected cleanup target not found: {old[:80]!r}')
              text = text.replace(old, new)

          id_targets = ['sectionDock', 'menuLinks', 'alsoGrid', 'pwViewBody']
          for ident in id_targets:
              needle = f' id="{ident}"'
              if text.count(needle) != 1:
                  raise SystemExit(f'Expected one {needle}, found {text.count(needle)}')
              text = text.replace(needle, '')

          for i in range(8):
              needle = f' id="pm-{i}"'
              if text.count(needle) != 1:
                  raise SystemExit(f'Expected one {needle}, found {text.count(needle)}')
              text = text.replace(needle, '')

          index.write_text(text, encoding='utf-8')

          p404 = Path('404.html')
          text404 = p404.read_text(encoding='utf-8')
          dead404 = "  .redirect-note{ margin-top:1.2rem; font-size:0.88rem; opacity:0.75; }\n\n"
          if text404.count(dead404) != 1:
              raise SystemExit('Expected one dead .redirect-note rule')
          p404.write_text(text404.replace(dead404, ''), encoding='utf-8')

          archive = Path('archive/projects-cinematic-v1-20260905.html')
          if not archive.exists():
              raise SystemExit('Expected archive snapshot to exist')
          archive.unlink()

          forbidden = [
              '.terminal-cursor', '.sr-only', '.pw-view-close-group', '.pw-view-pos',
              '.edu-item', 'timeline-compact', 'cert-name', 'link-primary',
              'id="sectionDock"', 'id="menuLinks"', 'id="alsoGrid"', 'id="pwViewBody"',
          ] + [f'id="pm-{i}"' for i in range(8)]
          now = index.read_text(encoding='utf-8')
          for token in forbidden:
              if token in now:
                  raise SystemExit(f'Cleanup token still present: {token}')
          if '.redirect-note' in p404.read_text(encoding='utf-8'):
              raise SystemExit('.redirect-note still present')

          scripts = []
          for html_path in [index, p404]:
              html = html_path.read_text(encoding='utf-8')
              for m in re.finditer(r'(?is)<script\b([^>]*)>(.*?)</script\s*>', html):
                  attrs, body = m.group(1), m.group(2)
                  if re.search(r'\bsrc\s*=', attrs, re.I):
                      continue
                  type_m = re.search(r'\btype\s*=\s*(["\'])(.*?)\1', attrs, re.I)
                  if type_m and type_m.group(2).lower() not in {'text/javascript', 'application/javascript', 'module'}:
                      continue
                  scripts.append((html_path.name, body))

          for idx, (name, body) in enumerate(scripts):
              temp = Path(tempfile.gettempdir()) / f'inline-{idx}.js'
              temp.write_text(body, encoding='utf-8')
              subprocess.run(['node', '--check', str(temp)], check=True)

          print(f'Validated {len(scripts)} inline JavaScript blocks.')
      - name: Remove temporary audit machinery
        shell: bash
        run: |
          rm -f audit-report.md markup-hook-report.md dynamic-class-report.md
          rm -f .github/workflows/dead-code-audit.yml
          rm -f .github/workflows/markup-hook-audit.yml
          rm -f .github/workflows/dynamic-class-audit.yml
          rm -f .github/workflows/apply-dead-code-cleanup.yml
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove dead code and unused files"
          git push
