name: Rebuild Projects section

on:
  push:
    branches:
      - redesign/projects-aristide-inspired
    paths:
      - .github/workflows/rebuild-projects.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Projects redesign
        run: python3 scripts/rebuild_projects.py
      - name: Diagnose obsolete hooks
        run: |
          grep -n -C 2 'mini-card\|projects-wall\|pw-row\|pw-view\|pw-preview\|pwSource\|sub-projects-wrap\|also-built\|pc-detail-lock' index.html || true
      - name: Validate redesign
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          text=Path('index.html').read_text(encoding='utf-8')
          for token in ['class="folio-section"','id="folioRibbon"','id="folioDetail"','id="folioSource"','function openDetail','function scrollToIndex','folio-detail-lock']:
            assert token in text, token
          for token in ['projects-wall','pw-row','pw-view','pw-preview','pwSource','sub-projects-wrap','also-built','mini-card','pc-detail-lock']:
            assert token not in text, token
          for pid in ['craft','proj-siem','proj-helpdesk','proj-ad-auditor','proj-phishing','proj-jotrelay','proj-toolkit','proj-winlog']:
            assert text.count('id="'+pid+'"') == 1, pid
            assert text.count('data-project="'+pid+'"') == 1, pid+' source'
          class IDs(HTMLParser):
            def __init__(self): super().__init__(); self.ids=[]
            def handle_starttag(self, tag, attrs):
              for k,v in attrs:
                if k == 'id' and v: self.ids.append(v)
          p=IDs(); p.feed(text)
          dup=sorted({x for x in p.ids if p.ids.count(x)>1})
          assert not dup, 'duplicate ids: '+', '.join(dup)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8'); blocks=[]
          for m in re.finditer(r'<script([^>]*)>(.*?)</script>',text,re.S|re.I):
            attrs=m.group(1)
            if re.search(r'\bsrc\s*=',attrs,re.I): continue
            tm=re.search(r'\btype\s*=\s*["\']([^"\']+)',attrs,re.I)
            if tm and tm.group(1).lower() not in ('text/javascript','application/javascript','module'): continue
            blocks.append(m.group(2))
          out=Path('/tmp/js-check');out.mkdir(exist_ok=True)
          for i,b in enumerate(blocks):(out/f'{i}.js').write_text(b,encoding='utf-8')
          PY
          for f in /tmp/js-check/*.js; do node --check "$f"; done
          git diff --check
      - name: Capture visual QA screenshots
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          hook='<script>try{sessionStorage.setItem("hs_booted","1")}catch(e){};addEventListener("load",function(){setTimeout(function(){var p=document.getElementById("projects");if(!p)return;var q=new URLSearchParams(location.search);if(q.has("mid")){scrollTo(0,p.offsetTop+(p.offsetHeight-innerHeight)*.5)}else{p.scrollIntoView()}if(q.has("detail")){setTimeout(function(){var c=document.querySelector(".folio-project");if(c)c.click()},650)}},500)});</script>'
          text=text.replace('<body id="top">','<body id="top">'+hook,1)
          Path('visual-projects.html').write_text(text,encoding='utf-8')
          PY
          python3 -m http.server 4173 >/tmp/folio-server.log 2>&1 &
          SERVER_PID=$!
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=1440,900 --virtual-time-budget=3500 --screenshot=projects-desktop.png 'http://127.0.0.1:4173/visual-projects.html'
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=1440,900 --virtual-time-budget=3500 --screenshot=projects-desktop-mid.png 'http://127.0.0.1:4173/visual-projects.html?mid=1'
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=390,844 --virtual-time-budget=3500 --screenshot=projects-mobile.png 'http://127.0.0.1:4173/visual-projects.html'
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=1440,900 --virtual-time-budget=4200 --screenshot=projects-detail.png 'http://127.0.0.1:4173/visual-projects.html?detail=1'
          kill "$SERVER_PID"
      - uses: actions/upload-artifact@v4
        with:
          name: projects-redesign-qa
          path: |
            projects-desktop.png
            projects-desktop-mid.png
            projects-mobile.png
            projects-detail.png
      - name: Remove temporary files
        run: |
          rm -f visual-projects.html projects-desktop.png projects-desktop-mid.png projects-mobile.png projects-detail.png
          rm -f scripts/rebuild_projects.py .github/workflows/rebuild-projects.yml
      - name: Commit redesign
        run: |
          git config user.name "Hans Sai"
          git config user.email "37721651+Spairkie@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild Projects as cinematic project gallery"
          git push
