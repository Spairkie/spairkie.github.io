name: Fix Projects keyboard state
on:
  push:
    branches: [fix/projects-scroll-engine-v2]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply correction
        run: python3 scripts/fix_projects_keyboard_state.py
      - name: Validate source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          assert 'var keyboardNavUntil = 0;' in text
          assert "if(performance.now() >= keyboardNavUntil)" in text
          assert "if(source === 'keyboard') keyboardNavUntil = performance.now()+520;" in text
          assert 'keyboardNavUntil = 0; keyboardIndex = activeIndex' in text
          blocks=[]
          for m in re.finditer(r'<script([^>]*)>(.*?)</script>',text,re.S|re.I):
            attrs=m.group(1)
            if re.search(r'\bsrc\s*=',attrs,re.I): continue
            tm=re.search(r'\btype\s*=\s*["\']([^"\']+)',attrs,re.I)
            if tm and tm.group(1).lower() not in ('text/javascript','application/javascript','module'): continue
            blocks.append(m.group(2))
          out=Path('/tmp/js-check'); out.mkdir(exist_ok=True)
          for i,b in enumerate(blocks): (out/f'{i}.js').write_text(b,encoding='utf-8')
          PY
          for f in /tmp/js-check/*.js; do node --check "$f"; done
          git diff --check
      - name: Browser interaction QA
        run: |
          mkdir -p /tmp/projects-qa
          npm install --prefix /tmp/projects-qa puppeteer-core@24 >/dev/null 2>&1
          python3 -m http.server 8000 >/tmp/projects-http.log 2>&1 &
          SERVER_PID=$!
          export NODE_PATH=/tmp/projects-qa/node_modules
          cat >/tmp/projects-qa.js <<'JS'
          const puppeteer=require('puppeteer-core');
          const cp=require('child_process');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          function chromePath(){for(const c of ['google-chrome','google-chrome-stable','chromium','chromium-browser']){try{return cp.execFileSync('which',[c],{encoding:'utf8'}).trim()}catch(e){}}throw new Error('Chrome not found')}
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:chromePath(),args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:1440,height:900});
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:30000});
            await page.evaluate(()=>sessionStorage.setItem('hs_booted','1'));
            await page.reload({waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>window.hsProjects&&document.getElementById('projects'));
            await page.evaluate(()=>{const r=document.getElementById('projects');window.scrollTo(0,r.offsetTop+80)});
            await sleep(100);
            await page.mouse.move(720,450);
            for(let i=0;i<4;i++){const y=await page.evaluate(()=>scrollY);await page.mouse.wheel({deltaY:120});await sleep(70);const n=await page.evaluate(()=>scrollY);if(n<=y)throw new Error('wheel stalled at '+i)}
            await page.evaluate(()=>{const r=document.getElementById('projects');window.scrollTo(0,r.offsetTop+80)});
            await sleep(120);
            const before=await page.evaluate(()=>{const e=document.querySelector('.folio-project[aria-current="true"]');return {id:e.id,index:+e.dataset.index}});
            await page.keyboard.press('ArrowRight');
            await sleep(440);
            const right=await page.evaluate(()=>{const e=document.querySelector('.folio-project[aria-current="true"]');return {id:e.id,index:+e.dataset.index}});
            if(right.index!==before.index+1)throw new Error('Right skipped: '+JSON.stringify({before,right}));
            await page.keyboard.press('ArrowLeft');
            await sleep(440);
            const left=await page.evaluate(()=>{const e=document.querySelector('.folio-project[aria-current="true"]');return {id:e.id,index:+e.dataset.index}});
            if(left.index!==before.index)throw new Error('Left did not return: '+JSON.stringify({before,left}));
            await page.keyboard.press('ArrowRight');
            await sleep(440);
            const selected=await page.evaluate(()=>{const e=document.querySelector('.folio-project[aria-current="true"]');return {id:e.id,index:+e.dataset.index}});
            if(selected.index!==before.index+1)throw new Error('Second Right skipped: '+JSON.stringify({before,selected}));
            await page.keyboard.press('ArrowDown');await sleep(120);
            if(!(await page.evaluate(()=>!document.getElementById('folioDetail').hidden)))throw new Error('Down did not open');
            await page.keyboard.press('ArrowDown');await sleep(500);
            if((await page.evaluate(()=>document.getElementById('folioDetailScroll').scrollTop))<=0)throw new Error('Down did not scroll detail');
            await page.evaluate(()=>document.getElementById('folioDetailScroll').scrollTo(0,0));await sleep(50);
            const pt=await page.$eval('#folioDetailScroll',el=>{const r=el.getBoundingClientRect();return{x:r.left+r.width*.9,y:r.top+r.height*.72}});
            await page.mouse.move(pt.x,pt.y);await page.mouse.wheel({deltaY:500});await sleep(120);
            const nested=await page.evaluate(()=>document.getElementById('folioDetailScroll').scrollTop);
            if(nested<=0)throw new Error('Nested wheel blocked');
            const title1=await page.evaluate(()=>document.getElementById('folioDetailTitle').textContent);
            await page.keyboard.press('ArrowRight');await sleep(100);
            const title2=await page.evaluate(()=>document.getElementById('folioDetailTitle').textContent);
            if(title1===title2)throw new Error('Right did not switch project in detail');
            await page.keyboard.press('Escape');await sleep(900);
            if(!(await page.evaluate(()=>document.getElementById('folioDetail').hidden)))throw new Error('Escape did not close detail');
            console.log(JSON.stringify({before,right,left,selected,nested,detailSwitch:[title1,title2]},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/projects-qa.js
          kill $SERVER_PID || true
      - name: Remove temporary files
        run: rm -f scripts/fix_projects_keyboard_state.py .github/workflows/fix-projects-keyboard-state.yml
      - name: Commit correction
        run: |
          git config user.name "Hans Sai"
          git config user.email "37721651+Spairkie@users.noreply.github.com"
          git add -A
          git commit -m "Tighten Projects keyboard selection state"
          git push
